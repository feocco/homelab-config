services:
  bedtime:
    host: macmini
    path: services/bedtime
    source:
      repo: feocco/bedtime
      path_hint: ${HOME}/code/bedtime
    default_strategy: direct
    smoke_checks:
      - docker ps --filter name=bedtime
    restore:
      required_for:
        - data/**

  caddy:
    host: macmini
    path: services/caddy
    source:
      repo: feocco/homelab-config
      path_hint: ${HOME}/code/homelab-config/services/caddy
    default_strategy: canary
    smoke_checks:
      - curl -I --max-time 5 http://127.0.0.1/
    restore:
      required_for: []

  dashy:
    host: macmini
    path: services/dashy
    source:
      repo: feocco/homelab-config
      path_hint: ${HOME}/code/homelab-config/services/dashy
    default_strategy: direct
    smoke_checks:
      - curl -fsS http://127.0.0.1:8080/
    restore:
      required_for:
        - user-data/**

  dashy-redirect:
    host: nasfeo
    path: services/dashy-redirect
    source:
      repo: feocco/homelab-config
      path_hint: ${HOME}/code/homelab-config/services/dashy-redirect
    default_strategy: direct
    smoke_checks:
      - docker ps --filter name=dashy-redirect
    restore:
      required_for: []

  dog-bowl-monitor:
    host: macmini
    path: services/dog-bowl-monitor
    source:
      repo: feocco/dog-bowl-monitor
      path_hint: ${HOME}/code/dog-bowl-monitor
    default_strategy: direct
    smoke_checks:
      - curl -fsS http://127.0.0.1:8101/health
    restore:
      required_for:
        - data/**

  hass-janitor:
    host: macmini
    path: services/hass-janitor
    source:
      repo: feocco/hass-janitor
      path_hint: ${HOME}/code/hass-janitor
    default_strategy: direct
    smoke_checks:
      - docker ps --filter name=hass-janitor
    restore:
      required_for:
        - data/**

  hello-nas:
    host: macmini
    path: services/hello-nas
    source:
      repo: feocco/hello-nas
      path_hint: ${HOME}/code/hello-nas
    default_strategy: direct
    smoke_checks:
      - curl -fsS http://127.0.0.1:8099/health
    restore:
      required_for: []

  homarr:
    host: macmini
    path: services/homarr
    source:
      repo: feocco/homelab-config
      path_hint: ${HOME}/code/homelab-config/services/homarr
    default_strategy: canary
    smoke_checks:
      - curl -fsS http://127.0.0.1:7575/
    restore:
      required_for:
        - data/**
        - seed/**

  homelab-functions:
    host: macmini
    path: services/homelab-functions
    source:
      repo: feocco/homelab-functions
      path_hint: ${HOME}/code/homelab-functions
    default_strategy: direct
    smoke_checks:
      - curl -fsS http://127.0.0.1:8091/health
    restore:
      required_for:
        - data/**

  homelab-log-watcher:
    host: macmini
    path: services/homelab-log-watcher
    source:
      repo: feocco/homelab-log-watcher
      path_hint: ${HOME}/code/homelab-log-watcher
    default_strategy: direct
    smoke_checks:
      - docker ps --filter name=homelab-log-watcher
    restore:
      required_for:
        - data/**

  homelab-monitor:
    host: macmini
    path: services/homelab-monitor
    source:
      repo: feocco/homelab-monitor
      path_hint: ${HOME}/code/homelab-monitor
    default_strategy: canary
    smoke_checks:
      - ./scripts/check-macmini-monitor-health
    restore:
      required_for:
        - grafana/**
        - prometheus/**

  homelab-sre-agent:
    host: macmini
    path: services/homelab-sre-agent
    source:
      repo: feocco/homelab-sre-agent
      path_hint: ${HOME}/code/homelab-sre-agent
    default_strategy: direct
    smoke_checks:
      - curl -fsS http://127.0.0.1:8094/health
    restore:
      required_for:
        - data/**

  instacart-history-service:
    host: macmini
    path: services/instacart-history-service
    source:
      repo: feocco/instacart-history-service
      path_hint: ${HOME}/code/instacart-history-service
    default_strategy: direct
    smoke_checks:
      - curl -fsS http://127.0.0.1:8100/health
    restore:
      required_for:
        - data/**

  mealie:
    host: macmini
    path: services/mealie
    source:
      repo: feocco/homelab-config
      path_hint: ${HOME}/code/homelab-config/services/mealie
    default_strategy: canary
    smoke_checks:
      - curl -fsS http://127.0.0.1:9925/api/app/about
    restore:
      required_for:
        - data/**
        - migrations/**
        - recovery/**

  mealie-planner:
    host: macmini
    path: services/mealie-planner
    source:
      repo: feocco/mealie-planner
      path_hint: ${HOME}/code/mealie-planner
    default_strategy: direct
    smoke_checks:
      - curl -fsS http://127.0.0.1:8097/health
    restore:
      required_for:
        - data/**

  netalertx:
    host: nasfeo
    path: services/netalertx
    source:
      repo: feocco/homelab-config
      path_hint: ${HOME}/code/homelab-config/services/netalertx
    default_strategy: canary
    smoke_checks:
      - docker ps --filter name=netalertx
    restore:
      required_for:
        - config/**
        - db/**

  plant-monitor:
    host: macmini
    path: services/plant-monitor
    source:
      repo: feocco/plant-monitor
      path_hint: ${HOME}/code/plant-monitor
    default_strategy: direct
    smoke_checks:
      - curl -fsS http://127.0.0.1:8088/health
    restore:
      required_for:
        - data/**
        - plants.yaml

  portainer:
    host: nasfeo
    path: services/portainer
    source:
      repo: feocco/homelab-config
      path_hint: ${HOME}/code/homelab-config/services/portainer
    default_strategy: canary
    smoke_checks:
      - docker ps --filter name=portainer
    restore:
      required_for:
        - data/**
