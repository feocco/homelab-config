services:
  dashy-redirect:
    image: nginx:1.29.3-alpine
    container_name: dashy-redirect
    restart: unless-stopped
    ports:
      - "${HOST_BIND_ADDR:-127.0.0.1}:${HOST_PORT:-8080}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "1"
        compress: "false"
