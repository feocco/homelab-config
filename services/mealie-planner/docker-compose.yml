services:
  mealie-planner:
    image: ghcr.io/feocco/mealie-planner:latest
    platform: ${SERVICE_PLATFORM:-linux/amd64}
    container_name: mealie-planner
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${HOST_BIND_ADDR:-127.0.0.1}:${MEALIE_PLANNER_PORT:-8097}:8080"
    volumes:
      - ./data:/app/data
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "1"
        compress: "false"
