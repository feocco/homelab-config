services:
  laundry-monitor:
    image: ghcr.io/feocco/laundry-monitor:latest
    platform: ${SERVICE_PLATFORM:-linux/amd64}
    container_name: laundry-monitor
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${HOST_BIND_ADDR:-127.0.0.1}:${SERVICE_PORT:-8102}:${SERVICE_PORT:-8102}"
    volumes:
      - ./data:/app/data
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "1"
        compress: "false"
