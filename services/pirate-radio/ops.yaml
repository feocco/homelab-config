service: pirate-radio
kind: multi-container
host: macmini
source_repo: feocco/pirate-wires-reader
images:
  - ghcr.io/feocco/pirate-radio:latest
  - postgres:17-alpine
public_image: true
containers:
  - pirate-radio
  - pirate-radio-postgres
http_port: 8103
port_env: SERVICE_PORT
health_path: /health
docs_path: /docs
openapi_path: /openapi.json
api_framework: node-http-server
live_base_url: https://pirate-radio.home.feocco.com
tailnet: false
monitoring: true
sre: true
route_hostname: pirate-radio.home.feocco.com
route_target_port: 8103
route_https: true
route_dns: unifi
route_tailscale_service: svc:pirate-radio
dashboard_name: Pirate Radio
dashboard_group: Runtime Services
dashboard_description: Pirate Wires audio reader
dashboard_icon: radio.png
secrets:
  - OPENAI_API_KEY
  - POSTGRES_PASSWORD
  - PIRATE_RADIO_OIDC_CLIENT_ID
  - PIRATE_RADIO_OIDC_CLIENT_SECRET
  - HA_URL
  - HA_LONG_LIVED_TOKEN
  - HOMELAB_FUNCTIONS_TOKEN
