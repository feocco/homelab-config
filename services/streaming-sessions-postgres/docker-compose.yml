services:
  streaming-sessions-postgres:
    image: postgres:18.4
    container_name: streaming-sessions-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${HOST_BIND_ADDR:-127.0.0.1}:${POSTGRES_PORT:-15432}:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-streaming_sessions}"
      POSTGRES_USER: "${POSTGRES_USER:-streaming_sessions}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - ./data:/var/lib/postgresql
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "1"
        compress: "false"
