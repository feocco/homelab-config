services:
  homelab-smoke-signal:
    image: ghcr.io/feocco/homelab-smoke-signal:latest
    platform: ${SERVICE_PLATFORM:-linux/amd64}
    container_name: homelab-smoke-signal
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${HOST_BIND_ADDR:-127.0.0.1}:${SERVICE_PORT:-8095}:${SERVICE_PORT:-8095}"
    volumes:
      - ./data:/app/data
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "1"
        compress: "false"
