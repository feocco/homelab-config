service: hass-janitor
kind: app
host: macmini
source_repo: feocco/hass-janitor
image: ghcr.io/feocco/hass-janitor:latest
public_image: false
container: hass-janitor
http_port: 8092
port_env: SERVICE_PORT
health_path: /health
docs_path: /docs
openapi_path: /openapi.json
api_framework: python-http-server
live_base_url: http://maclabs-mac-mini.taildf3445.ts.net:8092
tailnet: true
monitoring: true
sre: true
route_hostname: hass-janitor.home.feocco.com
route_target_port: 8092
route_https: true
route_dns: unifi
dashboard_name: hass-janitor
dashboard_group: Runtime Services
dashboard_description: Home Assistant cleanup and action helper
dashboard_icon: home-assistant.png
secrets:
  - HA_BASE_URL
  - HA_TOKEN
  - HASS_JANITOR_API_TOKEN
  - HOMELAB_FUNCTIONS_TOKEN
