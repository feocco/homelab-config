services:
  hass-janitor:
    image: ghcr.io/feocco/hass-janitor:latest
    platform: ${SERVICE_PLATFORM:-linux/amd64}
    container_name: hass-janitor
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - hass_janitor_logs:/app/logs
    ports:
      - "${HOST_BIND_ADDR:-127.0.0.1}:${SERVICE_PORT:-8092}:${SERVICE_PORT:-8092}"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "1"
        compress: "false"

volumes:
  hass_janitor_logs:
