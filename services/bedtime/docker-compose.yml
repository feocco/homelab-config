services:
  bedtime:
    image: ghcr.io/feocco/bedtime:latest
    platform: ${SERVICE_PLATFORM:-linux/amd64}
    container_name: bedtime
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${HOST_BIND_ADDR:-127.0.0.1}:${SERVICE_PORT:-8104}:${SERVICE_PORT:-8104}"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "1"
        compress: "false"
