services:
  homelab-sre-agent:
    image: ghcr.io/feocco/homelab-sre-agent:latest
    platform: ${SERVICE_PLATFORM:-linux/amd64}
    container_name: homelab-sre-agent
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${HOST_BIND_ADDR:-127.0.0.1}:${SERVICE_PORT:-8094}:${SERVICE_PORT:-8094}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data:/app/state
      - ./services.yaml:/app/config/services.yaml:ro
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "1"
        compress: "false"
