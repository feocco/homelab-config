service: homelab-sre-agent
kind: app
host: macmini
source_repo: feocco/homelab-sre-agent
image: ghcr.io/feocco/homelab-sre-agent:latest
public_image: false
container: homelab-sre-agent
http_port: 8094
port_env: SERVICE_PORT
