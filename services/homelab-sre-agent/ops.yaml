dashboard_icon: grafana.png
dashboard_url: https://homelab-sre-agent.home.feocco.com/incidents
secrets:
  - HA_URL
  - HA_LONG_LIVED_TOKEN
  - HOMELAB_FUNCTIONS_TOKEN
  - SRE_INCIDENT_TOKEN
  - GITHUB_TOKEN
  - GITHUB_APP_PRIVATE_KEY_B64
  - AWS_ACCESS_KEY_ID
  - AWS_SECRET_ACCESS_KEY
