services:
  waiting:
    image: ghcr.io/feocco/waiting:latest
    platform: ${SERVICE_PLATFORM:-linux/amd64}
    container_name: waiting
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:${SERVICE_PORT:-8106}:${SERVICE_PORT:-8106}"
    volumes:
      - ./data:/app/data
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "1"
        compress: "false"
