service: waiting
kind: app
host: macmini
source_repo: feocco/waiting
image: ghcr.io/feocco/waiting:latest
public_image: false
container: waiting
http_port: 8106
port_env: SERVICE_PORT
health_path: /health
docs_path: /docs
openapi_path: /openapi.json
api_framework: aiohttp
live_base_url: http://maclabs-mac-mini.taildf3445.ts.net:8106
tailnet: true
monitoring: true
sre: true
route_hostname: waiting.home.feocco.com
route_auth: authentik_forward_auth
route_auth_bypass_paths:
  - /v1/*
  - /health
  - /docs
  - /openapi.json
route_target_port: 8106
route_https: true
route_dns: unifi
dashboard_name: Waiting on me
dashboard_group: Runtime Services
dashboard_description: Action inbox of everything waiting on Joe
dashboard_icon: python.png
secrets:
  - WAITING_TOKEN
  - DASHBOARD_GH_APP_KEY
  - CURSOR_API_KEY
