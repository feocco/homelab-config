service: plant-monitor
kind: app
host: macmini
source_repo: feocco/plant-monitor
image: ghcr.io/feocco/plant-monitor:latest
public_image: true
container: plant-monitor
http_port: 8088
port_env: SERVICE_PORT
health_path: /health
live_base_url: http://maclabs-mac-mini.taildf3445.ts.net:8088
tailnet: true
monitoring: true
sre: true
dashboard_name: Plant Monitor
dashboard_group: Runtime Services
dashboard_description: Home Assistant plant notifications
dashboard_icon: home-assistant.png
secrets:
  - HA_URL
  - HA_LONG_LIVED_TOKEN
  - HOMELAB_FUNCTIONS_TOKEN
  - SERVICE_CALLBACK_TOKEN
