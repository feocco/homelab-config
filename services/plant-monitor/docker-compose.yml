services:
  plant-monitor:
    image: ghcr.io/feocco/plant-monitor:latest
    container_name: plant-monitor
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./plants.yaml:/app/plants.yaml:ro
      - ./data:/app/data
    ports:
      - "${HOST_BIND_ADDR:-127.0.0.1}:${SERVICE_PORT:-8088}:${SERVICE_PORT:-8088}"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "1"
        compress: "false"
