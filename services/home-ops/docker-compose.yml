services:
  home-ops:
    image: ghcr.io/feocco/home-ops:f5c9570ed24ab82d73a1c037e1b768ec122903e7
    platform: ${SERVICE_PLATFORM:-linux/amd64}
    container_name: home-ops
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${HOST_BIND_ADDR:-127.0.0.1}:${SERVICE_PORT:-8107}:${SERVICE_PORT:-8107}"
    volumes:
      - ./data:/app/data
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "1"
        compress: "false"
