services:
  homebox:
    image: ghcr.io/sysadminsmedia/homebox:latest
    container_name: homebox
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:${HOMEBOX_HTTP_PORT:-8105}:7745"
    volumes:
      - ./data:/data
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "1"
        compress: "false"
