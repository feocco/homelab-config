services:
  hello-nas:
    image: ghcr.io/feocco/hello-nas:latest
    platform: ${SERVICE_PLATFORM:-linux/amd64}
    container_name: hello-nas
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${HOST_BIND_ADDR:-127.0.0.1}:${HOST_PORT:-8099}:8080"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "1"
        compress: "false"
