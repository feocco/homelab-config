version: 1
metadata:
  name: Pirate Radio OIDC application
context:
  client_id: !Env PIRATE_RADIO_OIDC_CLIENT_ID
  client_secret: !Env PIRATE_RADIO_OIDC_CLIENT_SECRET
entries:
  - id: pirate-radio-invalidation-flow
    model: authentik_flows.flow
    identifiers:
      slug: pirate-radio-invalidation
    attrs:
      name: Pirate Radio logout
      title: You've logged out of Pirate Radio.
      designation: invalidation
      authentication: none
      denied_action: message_continue
      layout: stacked
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf pirate-radio-invalidation-flow
      stage: !Find [authentik_stages_user_logout.userlogoutstage, [name, default-invalidation-logout]]
      order: 0
  - id: groups-scope
    model: authentik_providers_oauth2.scopemapping
    identifiers:
      name: Feocco Home OIDC groups
    attrs:
      scope_name: groups
      description: Authentik group names
      expression: |
        return {"groups": [group.name for group in request.user.groups.all()]}
  - id: pirate-radio-provider
    model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: Pirate Radio
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !KeyOf pirate-radio-invalidation-flow
      client_type: confidential
      client_id: !Context client_id
      client_secret: !Context client_secret
      grant_types: [authorization_code]
      include_claims_in_id_token: true
      sub_mode: user_uuid
      issuer_mode: per_provider
      redirect_uris:
        - matching_mode: strict
          url: https://reader.home.feocco.com/auth/callback
          redirect_uri_type: authorization
        - matching_mode: strict
          url: https://pirate-radio.home.feocco.com/auth/callback
          redirect_uri_type: authorization
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !KeyOf groups-scope
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
  - id: pirate-radio-application
    model: authentik_core.application
    identifiers:
      slug: pirate-radio
    attrs:
      name: Pirate Radio
      provider: !KeyOf pirate-radio-provider
      meta_launch_url: https://reader.home.feocco.com
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf pirate-radio-application
      group: !Find [authentik_core.group, [name, pirate-radio-users]]
      order: 0
