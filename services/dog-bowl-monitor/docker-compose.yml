services:
  dog-bowl-monitor:
    image: ghcr.io/feocco/dog-bowl-monitor:latest
    platform: ${SERVICE_PLATFORM:-linux/arm64}
    container_name: dog-bowl-monitor
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${HOST_BIND_ADDR:-127.0.0.1}:${SERVICE_PORT:-8101}:${SERVICE_PORT:-8101}"
    volumes:
      - ./data:/app/data
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "1"
        compress: "false"
