services:
  homelab-functions:
    image: ghcr.io/feocco/homelab-functions:latest
    platform: ${SERVICE_PLATFORM:-linux/amd64}
    container_name: homelab-functions
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    ports:
      - "${HOST_BIND_ADDR:-127.0.0.1}:${SERVICE_PORT:-8091}:${SERVICE_PORT:-8091}"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "1"
        compress: "false"
