service: homepage
kind: app
host: macmini
source_repo: feocco/homelab-config
image: gethomepage/homepage:v1.13.2
public_image: true
container: homepage
http_port: 7576
port_env: HOMEPAGE_HTTP_PORT
health_path: /
tailnet: true
monitoring: true
sre: false
route_hostname: home.feocco.com
route_target_port: 7576
route_https: true
route_dns: unifi
route_aliases:
  - home.arpa
  - homepage.home.arpa
dashboard_name: Homepage
dashboard_group: Daily Ops
dashboard_description: Generated homelab front door
dashboard_icon: homepage.png
redeploy_on:
  - ^scripts/(generate-homepage-config|generate-service-catalog|lib/homelab_catalog.py)$
secrets:
