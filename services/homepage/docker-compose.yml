services:
  homepage:
    image: gethomepage/homepage:v1.13.2
    container_name: homepage
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-America/New_York}
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS:-home.feocco.com,home.arpa,homepage.home.arpa,localhost,127.0.0.1}
    ports:
      - "${HOST_BIND_ADDR:-127.0.0.1}:${HOMEPAGE_HTTP_PORT:-7576}:3000"
    volumes:
      - ./config:/app/config
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "1"
        compress: "false"
