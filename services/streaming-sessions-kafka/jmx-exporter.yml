startDelaySeconds: 0
ssl: false
lowercaseOutputName: true
lowercaseOutputLabelNames: true
jmxUrl: service:jmx:rmi:///jndi/rmi://streaming-sessions-kafka:19094/jmxrmi
rules:
  - pattern: 'java.lang<type=GarbageCollector, name=(.+)><>CollectionTime'
    name: kafka_jvm_gc_collection_seconds_total
    labels:
      gc: "$1"
    valueFactor: 0.001
    type: COUNTER
  - pattern: 'java.lang<type=GarbageCollector, name=(.+)><>CollectionCount'
    name: kafka_jvm_gc_collection_count_total
    labels:
      gc: "$1"
    type: COUNTER
  - pattern: 'java.lang<type=Memory><HeapMemoryUsage>(used|committed|max)'
    name: kafka_jvm_memory_heap_$1_bytes
    type: GAUGE
  - pattern: 'java.lang<type=Memory><NonHeapMemoryUsage>(used|committed|max)'
    name: kafka_jvm_memory_nonheap_$1_bytes
    type: GAUGE
