services:
  temporal:
    image: temporalio/temporal:latest
    container_name: temporal
    restart: unless-stopped
    user: "0:0"
    command: server start-dev --ip 0.0.0.0 --db-filename /data/temporal.db --namespace homelab
    volumes:
      - ./data:/data
    ports:
      - "7233:7233"
      - "8233:8233"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "1"
