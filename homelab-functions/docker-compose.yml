services:
  homelab-functions:
    image: ghcr.io/feocco/homelab-functions:latest
    container_name: homelab-functions
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${SERVICE_PORT:-8091}:${SERVICE_PORT:-8091}"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "1"
        compress: "false"
