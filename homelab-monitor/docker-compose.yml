services:
  prometheus:
    image: prom/prometheus:v3.11.3
    container_name: homelab-monitor-prometheus
    restart: unless-stopped
    env_file:
      - .env
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-30d}
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "1"
        compress: "false"

  grafana:
    image: grafana/grafana:13.0.1
    container_name: homelab-monitor-grafana
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://nasfeo:3000/}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_LOG_LEVEL: ${GRAFANA_LOG_LEVEL:-info}
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: ${TZ:-America/New_York}
      GF_UNIFIED_ALERTING_ENABLED: "true"
    ports:
      - "${GRAFANA_HTTP_PORT:-3000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "1"
        compress: "false"

  node-exporter:
    image: prom/node-exporter:v1.11.1
    container_name: homelab-monitor-node-exporter
    restart: unless-stopped
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/rootfs
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|volume1/@docker/.+)($|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "1"
        compress: "false"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: homelab-monitor-cadvisor
    restart: unless-stopped
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --max_housekeeping_interval=30s
      - --store_container_labels=false
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /volume1/@docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "1"
        compress: "false"

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0
    container_name: homelab-monitor-blackbox-exporter
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "1"
        compress: "false"

volumes:
  prometheus_data:
  grafana_data:
