defaults:
  issue_repo: feocco/homelab-config
  deploy_repo: feocco/homelab-config

services:
  hello-nas:
    containers:
      - hello-nas
    images:
      - ghcr.io/feocco/hello-nas:*
    source:
      repo: feocco/hello-nas
      path_hint: /Users/feocco/code/hello-nas
    issue_repo: feocco/hello-nas
    deploy:
      path: hello-nas
    runbook_url: https://github.com/feocco/homelab-config/tree/main/hello-nas
    labels:
      - homelab-sre
      - hello-nas
    sre:
      enabled: true
      autofix: true
      repo_daily_limit: 1

