services:
  hello-nas:
    env:
      - HELLO_NAS_MESSAGE
      - HOST_PORT

  plant-monitor:
    env:
      - HA_URL
      - HA_LONG_LIVED_TOKEN
      - TZ
      - LOG_LEVEL
      - HOMELAB_FUNCTIONS_URL
      - HOMELAB_FUNCTIONS_TOKEN
      - HA_PLANTS_DASHBOARD_URL
      - ALERT_SNOOZE_HOURS
      - ALERT_REPEAT_HOURS
      - SERVICE_HOST
      - SERVICE_PORT
      - SERVICE_CALLBACK_TOKEN
      - CONFIG_PATH
      - STATE_PATH
      - DRY_RUN

  plant-monitor-temporal:
    env:
      - HA_URL
      - HA_LONG_LIVED_TOKEN
      - TZ
      - LOG_LEVEL
      - HOMELAB_FUNCTIONS_URL
      - HOMELAB_FUNCTIONS_TOKEN
      - HA_PLANTS_DASHBOARD_URL
      - ALERT_SNOOZE_HOURS
      - ALERT_REPEAT_HOURS
      - CONFIG_PATH
      - STATE_PATH
      - DRY_RUN
      - TEMPORAL_ADDRESS
      - TEMPORAL_NAMESPACE
      - TEMPORAL_TASK_QUEUE
      - TEMPORAL_CONFIRM_TIMEOUT_SECONDS
      - TEMPORAL_ALERT_REPEAT_SECONDS
      - TEMPORAL_SNOOZE_SECONDS
      - TEMPORAL_WATERING_WINDOW_DELTA
      - TEMPORAL_WATERING_WINDOW_HOLD_SECONDS
      - TEMPORAL_DETECTOR_POLL_SECONDS
      - TEMPORAL_WATERING_FOLLOWUP_SECONDS

  homelab-functions:
    env:
      - HA_URL
      - HA_LONG_LIVED_TOKEN
      - HA_NOTIFY_JOE_SERVICE
      - HOMELAB_FUNCTIONS_TOKEN
      - SERVICE_HOST
      - SERVICE_PORT
      - TZ
      - LOG_LEVEL
      - REQUEST_TIMEOUT_SECONDS

  hass-janitor:
    env:
      - HA_BASE_URL
      - HA_TOKEN
      - HASS_JANITOR_API_TOKEN
      - HOMELAB_FUNCTIONS_URL
      - HOMELAB_FUNCTIONS_TOKEN
      - SERVICE_HOST
      - SERVICE_PORT
      - TZ
      - AUDIT_PATH
      - HASS_JANITOR_MONITOR_ENABLED
      - HASS_JANITOR_BACKUP_ENTITY_ID
      - HASS_JANITOR_BACKUP_MAX_AGE_DAYS
      - HASS_JANITOR_CHECK_INTERVAL_SECONDS
      - HASS_JANITOR_NOTIFICATION_COOLDOWN_SECONDS

  homelab-log-watcher:
    env:
      - HOMELAB_FUNCTIONS_URL
      - HOMELAB_FUNCTIONS_TOKEN
      - LOG_WATCHER_STATE_PATH
      - LOG_WATCHER_MATCH_PATTERNS
      - LOG_WATCHER_IGNORED_CONTAINERS
      - LOG_WATCHER_FINGERPRINT_COOLDOWN_SECONDS
      - LOG_WATCHER_GLOBAL_WINDOW_SECONDS
      - LOG_WATCHER_GLOBAL_MAX_NOTIFICATIONS
      - LOG_WATCHER_STARTUP_BACKFILL_SECONDS
      - LOG_WATCHER_PUBLIC_URL
      - LOG_WATCHER_ACTION_TOKEN
      - LOG_WATCHER_MUTE_MINUTES
      - SERVICE_HOST
      - SERVICE_PORT
      - LOG_LEVEL
