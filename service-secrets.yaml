services:
  plant-monitor:
    env:
      - HA_URL
      - HA_LONG_LIVED_TOKEN
      - HOMELAB_FUNCTIONS_TOKEN
      - SERVICE_CALLBACK_TOKEN

  plant-monitor-temporal:
    env:
      - HA_URL
      - HA_LONG_LIVED_TOKEN
      - HOMELAB_FUNCTIONS_TOKEN

  homelab-functions:
    env:
      - HA_URL
      - HA_LONG_LIVED_TOKEN
      - HOMELAB_FUNCTIONS_TOKEN

  hass-janitor:
    env:
      - HA_BASE_URL
      - HA_TOKEN
      - HASS_JANITOR_API_TOKEN
      - HOMELAB_FUNCTIONS_TOKEN

  homelab-log-watcher:
    env:
      - HOMELAB_FUNCTIONS_TOKEN
      - LOG_WATCHER_INCIDENT_WEBHOOK_TOKEN
      - LOG_WATCHER_ACTION_TOKEN

  homelab-sre-agent:
    env:
      - SRE_INCIDENT_TOKEN
      - GITHUB_TOKEN
