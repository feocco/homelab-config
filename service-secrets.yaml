services:
  hello-nas:
    env:
      - HELLO_NAS_MESSAGE
      - HOST_PORT

  plant-monitor:
    env:
      - HA_URL
      - HA_LONG_LIVED_TOKEN
      - TZ
      - LOG_LEVEL
      - HOMELAB_FUNCTIONS_URL
      - HOMELAB_FUNCTIONS_TOKEN
      - HA_PLANTS_DASHBOARD_URL
      - ALERT_SNOOZE_HOURS
      - ALERT_REPEAT_HOURS
      - SERVICE_HOST
      - SERVICE_PORT
      - SERVICE_CALLBACK_TOKEN
      - CONFIG_PATH
      - STATE_PATH
      - DRY_RUN

  homelab-functions:
    env:
      - HA_URL
      - HA_LONG_LIVED_TOKEN
      - HA_NOTIFY_JOE_SERVICE
      - HOMELAB_FUNCTIONS_TOKEN
      - SERVICE_HOST
      - SERVICE_PORT
      - TZ
      - LOG_LEVEL
      - REQUEST_TIMEOUT_SECONDS

  hass-janitor:
    env:
      - HA_BASE_URL
      - HA_TOKEN
      - HASS_JANITOR_API_TOKEN
      - HOMELAB_FUNCTIONS_URL
      - HOMELAB_FUNCTIONS_TOKEN
      - SERVICE_HOST
      - SERVICE_PORT
      - TZ
      - AUDIT_PATH
      - HASS_JANITOR_MONITOR_ENABLED
      - HASS_JANITOR_BACKUP_ENTITY_ID
      - HASS_JANITOR_BACKUP_MAX_AGE_DAYS
      - HASS_JANITOR_CHECK_INTERVAL_SECONDS
      - HASS_JANITOR_NOTIFICATION_COOLDOWN_SECONDS
