services:
  hello-nas:
    env:
      - HELLO_NAS_MESSAGE
      - HOST_PORT

  plant-monitor:
    env:
      - HA_URL
      - HA_LONG_LIVED_TOKEN
      - TZ
      - LOG_LEVEL
      - HA_NOTIFY_SERVICE
      - HA_PLANTS_DASHBOARD_URL
      - ALERT_SNOOZE_HOURS
      - ALERT_REPEAT_HOURS
      - SERVICE_HOST
      - SERVICE_PORT
      - SERVICE_CALLBACK_TOKEN
      - CONFIG_PATH
      - STATE_PATH
      - DRY_RUN

  homelab-functions:
    env:
      - HA_URL
      - HA_LONG_LIVED_TOKEN
      - HA_NOTIFY_JOE_SERVICE
      - HOMELAB_FUNCTIONS_TOKEN
      - SERVICE_HOST
      - SERVICE_PORT
      - TZ
      - LOG_LEVEL
      - REQUEST_TIMEOUT_SECONDS

  hass-janitor:
    env:
      - HA_BASE_URL
      - HA_TOKEN
      - HASS_JANITOR_API_TOKEN
      - SERVICE_HOST
      - SERVICE_PORT
      - TZ
      - AUDIT_PATH
