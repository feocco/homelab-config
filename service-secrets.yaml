services:
  plant-monitor:
    env:
      - HA_URL
      - HA_LONG_LIVED_TOKEN
      - HOMELAB_FUNCTIONS_TOKEN
      - SERVICE_CALLBACK_TOKEN

  homelab-functions:
    env:
      - HA_URL
      - HA_LONG_LIVED_TOKEN
      - HOMELAB_FUNCTIONS_TOKEN

  hass-janitor:
    env:
      - HA_BASE_URL
      - HA_TOKEN
      - HASS_JANITOR_API_TOKEN
      - HOMELAB_FUNCTIONS_TOKEN

  homelab-log-watcher:
    env:
      - HOMELAB_FUNCTIONS_TOKEN
      - LOG_WATCHER_INCIDENT_WEBHOOK_TOKEN
      - LOG_WATCHER_ACTION_TOKEN

  homelab-sre-agent:
    env:
      - HA_URL
      - HA_LONG_LIVED_TOKEN
      - HOMELAB_FUNCTIONS_TOKEN
      - SRE_INCIDENT_TOKEN
      - GITHUB_TOKEN
      - GITHUB_APP_PRIVATE_KEY_B64

  homelab-monitor:
    env:
      - GRAFANA_ADMIN_PASSWORD
      - HOMELAB_FUNCTIONS_TOKEN
      - OPENAI_ADMIN_KEY
