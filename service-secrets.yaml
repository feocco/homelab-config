services:
  caddy:
    env:
      - CLOUDFLARE_API_TOKEN

  authentik:
    env:
      - POSTGRES_PASSWORD
      - AUTHENTIK_SECRET_KEY
      - AUTHENTIK_BOOTSTRAP_PASSWORD_HASH
      - AUTHENTIK_EMAIL__USERNAME
      - AUTHENTIK_EMAIL__PASSWORD
      - AUTHENTIK_EMAIL__FROM
      - GOOGLE_OAUTH_CLIENT_ID
      - GOOGLE_OAUTH_CLIENT_SECRET
      - PIRATE_RADIO_OIDC_CLIENT_ID
      - PIRATE_RADIO_OIDC_CLIENT_SECRET

  plant-monitor:
    env:
      - HA_URL
      - HA_LONG_LIVED_TOKEN
      - HOMELAB_FUNCTIONS_TOKEN
      - SERVICE_CALLBACK_TOKEN

  homelab-functions:
    env:
      - HA_URL
      - HA_LONG_LIVED_TOKEN
      - HOMELAB_FUNCTIONS_TOKEN

  hass-janitor:
    env:
      - HA_BASE_URL
      - HA_TOKEN
      - HASS_JANITOR_API_TOKEN
      - HOMELAB_FUNCTIONS_TOKEN

  homelab-log-watcher:
    env:
      - HOMELAB_FUNCTIONS_TOKEN
      - LOG_WATCHER_INCIDENT_WEBHOOK_TOKEN
      - LOG_WATCHER_ACTION_TOKEN

  homelab-sre-agent:
    env:
      - HA_URL
      - HA_LONG_LIVED_TOKEN
      - HOMELAB_FUNCTIONS_TOKEN
      - SRE_INCIDENT_TOKEN
      - GITHUB_TOKEN
      - GITHUB_APP_PRIVATE_KEY_B64
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY

  homelab-monitor:
    env:
      - GRAFANA_ADMIN_PASSWORD
      - HOMELAB_FUNCTIONS_TOKEN
      - OPENAI_ADMIN_KEY

  homelab-smoke-signal:
    env:
      - HOMELAB_FUNCTIONS_TOKEN
      - HA_URL
      - HA_LONG_LIVED_TOKEN
      - HA_NOTIFY_JOE_SERVICE

  bedtime:
    env:
      - HA_URL
      - HA_LONG_LIVED_TOKEN
      - HOMELAB_FUNCTIONS_TOKEN

  mealie:
    env:
      - POSTGRES_PASSWORD
      - CLOUDFLARE_TUNNEL_TOKEN
      - OPENAI_API_KEY
      - SMTP_FROM_EMAIL
      - SMTP_USER
      - SMTP_PASSWORD

  mealie-planner:
    env:
      - OPENAI_API_KEY
      - MEALIE_API_TOKEN
      - HA_URL
      - HA_LONG_LIVED_TOKEN
      - HOMELAB_FUNCTIONS_TOKEN

  instacart-history-service:
    env:
      - OPENAI_API_KEY

  dog-bowl-monitor:
    env:
      - HA_URL
      - HA_LONG_LIVED_TOKEN
      - OPENAI_API_KEY
      - HOMELAB_FUNCTIONS_TOKEN

  laundry-monitor:
    env:
      - HA_URL
      - HA_LONG_LIVED_TOKEN
      - HA_NOTIFY_JOE_SERVICE
      - HA_NOTIFY_JESS_SERVICE

  pirate-radio:
    env:
      - POSTGRES_PASSWORD
      - PIRATE_RADIO_OIDC_CLIENT_ID
      - PIRATE_RADIO_OIDC_CLIENT_SECRET
      - X_API_BEARER_TOKEN
      - XAI_API_KEY
      - CURSOR_API_KEY
      - HA_URL
      - HA_LONG_LIVED_TOKEN
      - HOMELAB_FUNCTIONS_TOKEN

  streaming-sessions-postgres:
    env:
      - POSTGRES_PASSWORD

  streaming-sessions:
    env:
      - DATABASE_URL
      - STREAMING_SESSIONS_API_TOKEN
