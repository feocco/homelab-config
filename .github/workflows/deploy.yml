name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: Service to deploy, or "all"
        required: true
        default: plant-monitor
      force_recreate:
        description: Force recreate containers
        required: false
        default: "false"

jobs:
  deploy:
    runs-on: [self-hosted, nasfeo]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync checkout to runtime path
        run: |
          tar \
            --exclude './.git' \
            --exclude './*/.env' \
            --exclude './*/data' \
            -cf - . | tar -C /volume1/docker/homelab-config -xf -
          find . -path './*/data/.gitkeep' -type f | while read -r keep_file; do
            data_dir="${keep_file#./}"
            mkdir -p "/volume1/docker/homelab-config/${data_dir%/.gitkeep}"
          done

      - name: Render service environments
        env:
          # BEGIN GENERATED SERVICE SECRETS
          HASS_JANITOR__AUDIT_PATH: ${{ secrets.HASS_JANITOR__AUDIT_PATH }}
          HASS_JANITOR__HASS_JANITOR_API_TOKEN: ${{ secrets.HASS_JANITOR__HASS_JANITOR_API_TOKEN }}
          HASS_JANITOR__HASS_JANITOR_BACKUP_ENTITY_ID: ${{ secrets.HASS_JANITOR__HASS_JANITOR_BACKUP_ENTITY_ID }}
          HASS_JANITOR__HASS_JANITOR_BACKUP_MAX_AGE_DAYS: ${{ secrets.HASS_JANITOR__HASS_JANITOR_BACKUP_MAX_AGE_DAYS }}
          HASS_JANITOR__HASS_JANITOR_CHECK_INTERVAL_SECONDS: ${{ secrets.HASS_JANITOR__HASS_JANITOR_CHECK_INTERVAL_SECONDS }}
          HASS_JANITOR__HASS_JANITOR_MONITOR_ENABLED: ${{ secrets.HASS_JANITOR__HASS_JANITOR_MONITOR_ENABLED }}
          HASS_JANITOR__HASS_JANITOR_NOTIFICATION_COOLDOWN_SECONDS: ${{ secrets.HASS_JANITOR__HASS_JANITOR_NOTIFICATION_COOLDOWN_SECONDS }}
          HASS_JANITOR__HA_BASE_URL: ${{ secrets.HASS_JANITOR__HA_BASE_URL }}
          HASS_JANITOR__HA_TOKEN: ${{ secrets.HASS_JANITOR__HA_TOKEN }}
          HASS_JANITOR__HOMELAB_FUNCTIONS_TOKEN: ${{ secrets.HASS_JANITOR__HOMELAB_FUNCTIONS_TOKEN }}
          HASS_JANITOR__HOMELAB_FUNCTIONS_URL: ${{ secrets.HASS_JANITOR__HOMELAB_FUNCTIONS_URL }}
          HASS_JANITOR__SERVICE_HOST: ${{ secrets.HASS_JANITOR__SERVICE_HOST }}
          HASS_JANITOR__SERVICE_PORT: ${{ secrets.HASS_JANITOR__SERVICE_PORT }}
          HASS_JANITOR__TZ: ${{ secrets.HASS_JANITOR__TZ }}
          HELLO_NAS__HELLO_NAS_MESSAGE: ${{ secrets.HELLO_NAS__HELLO_NAS_MESSAGE }}
          HELLO_NAS__HOST_PORT: ${{ secrets.HELLO_NAS__HOST_PORT }}
          HOMELAB_FUNCTIONS__HA_LONG_LIVED_TOKEN: ${{ secrets.HOMELAB_FUNCTIONS__HA_LONG_LIVED_TOKEN }}
          HOMELAB_FUNCTIONS__HA_NOTIFY_JOE_SERVICE: ${{ secrets.HOMELAB_FUNCTIONS__HA_NOTIFY_JOE_SERVICE }}
          HOMELAB_FUNCTIONS__HA_URL: ${{ secrets.HOMELAB_FUNCTIONS__HA_URL }}
          HOMELAB_FUNCTIONS__HOMELAB_FUNCTIONS_TOKEN: ${{ secrets.HOMELAB_FUNCTIONS__HOMELAB_FUNCTIONS_TOKEN }}
          HOMELAB_FUNCTIONS__LOG_LEVEL: ${{ secrets.HOMELAB_FUNCTIONS__LOG_LEVEL }}
          HOMELAB_FUNCTIONS__REQUEST_TIMEOUT_SECONDS: ${{ secrets.HOMELAB_FUNCTIONS__REQUEST_TIMEOUT_SECONDS }}
          HOMELAB_FUNCTIONS__SERVICE_HOST: ${{ secrets.HOMELAB_FUNCTIONS__SERVICE_HOST }}
          HOMELAB_FUNCTIONS__SERVICE_PORT: ${{ secrets.HOMELAB_FUNCTIONS__SERVICE_PORT }}
          HOMELAB_FUNCTIONS__TZ: ${{ secrets.HOMELAB_FUNCTIONS__TZ }}
          HOMELAB_LOG_WATCHER__HOMELAB_FUNCTIONS_TOKEN: ${{ secrets.HOMELAB_LOG_WATCHER__HOMELAB_FUNCTIONS_TOKEN }}
          HOMELAB_LOG_WATCHER__HOMELAB_FUNCTIONS_URL: ${{ secrets.HOMELAB_LOG_WATCHER__HOMELAB_FUNCTIONS_URL }}
          HOMELAB_LOG_WATCHER__LOG_LEVEL: ${{ secrets.HOMELAB_LOG_WATCHER__LOG_LEVEL }}
          HOMELAB_LOG_WATCHER__LOG_WATCHER_ACTION_TOKEN: ${{ secrets.HOMELAB_LOG_WATCHER__LOG_WATCHER_ACTION_TOKEN }}
          HOMELAB_LOG_WATCHER__LOG_WATCHER_FINGERPRINT_COOLDOWN_SECONDS: ${{ secrets.HOMELAB_LOG_WATCHER__LOG_WATCHER_FINGERPRINT_COOLDOWN_SECONDS }}
          HOMELAB_LOG_WATCHER__LOG_WATCHER_GLOBAL_MAX_NOTIFICATIONS: ${{ secrets.HOMELAB_LOG_WATCHER__LOG_WATCHER_GLOBAL_MAX_NOTIFICATIONS }}
          HOMELAB_LOG_WATCHER__LOG_WATCHER_GLOBAL_WINDOW_SECONDS: ${{ secrets.HOMELAB_LOG_WATCHER__LOG_WATCHER_GLOBAL_WINDOW_SECONDS }}
          HOMELAB_LOG_WATCHER__LOG_WATCHER_IGNORED_CONTAINERS: ${{ secrets.HOMELAB_LOG_WATCHER__LOG_WATCHER_IGNORED_CONTAINERS }}
          HOMELAB_LOG_WATCHER__LOG_WATCHER_MATCH_PATTERNS: ${{ secrets.HOMELAB_LOG_WATCHER__LOG_WATCHER_MATCH_PATTERNS }}
          HOMELAB_LOG_WATCHER__LOG_WATCHER_MUTE_MINUTES: ${{ secrets.HOMELAB_LOG_WATCHER__LOG_WATCHER_MUTE_MINUTES }}
          HOMELAB_LOG_WATCHER__LOG_WATCHER_PUBLIC_URL: ${{ secrets.HOMELAB_LOG_WATCHER__LOG_WATCHER_PUBLIC_URL }}
          HOMELAB_LOG_WATCHER__LOG_WATCHER_STARTUP_BACKFILL_SECONDS: ${{ secrets.HOMELAB_LOG_WATCHER__LOG_WATCHER_STARTUP_BACKFILL_SECONDS }}
          HOMELAB_LOG_WATCHER__LOG_WATCHER_STATE_PATH: ${{ secrets.HOMELAB_LOG_WATCHER__LOG_WATCHER_STATE_PATH }}
          HOMELAB_LOG_WATCHER__SERVICE_HOST: ${{ secrets.HOMELAB_LOG_WATCHER__SERVICE_HOST }}
          HOMELAB_LOG_WATCHER__SERVICE_PORT: ${{ secrets.HOMELAB_LOG_WATCHER__SERVICE_PORT }}
          PLANT_MONITOR__ALERT_REPEAT_HOURS: ${{ secrets.PLANT_MONITOR__ALERT_REPEAT_HOURS }}
          PLANT_MONITOR__ALERT_SNOOZE_HOURS: ${{ secrets.PLANT_MONITOR__ALERT_SNOOZE_HOURS }}
          PLANT_MONITOR__CONFIG_PATH: ${{ secrets.PLANT_MONITOR__CONFIG_PATH }}
          PLANT_MONITOR__DRY_RUN: ${{ secrets.PLANT_MONITOR__DRY_RUN }}
          PLANT_MONITOR__HA_LONG_LIVED_TOKEN: ${{ secrets.PLANT_MONITOR__HA_LONG_LIVED_TOKEN }}
          PLANT_MONITOR__HA_PLANTS_DASHBOARD_URL: ${{ secrets.PLANT_MONITOR__HA_PLANTS_DASHBOARD_URL }}
          PLANT_MONITOR__HA_URL: ${{ secrets.PLANT_MONITOR__HA_URL }}
          PLANT_MONITOR__HOMELAB_FUNCTIONS_TOKEN: ${{ secrets.PLANT_MONITOR__HOMELAB_FUNCTIONS_TOKEN }}
          PLANT_MONITOR__HOMELAB_FUNCTIONS_URL: ${{ secrets.PLANT_MONITOR__HOMELAB_FUNCTIONS_URL }}
          PLANT_MONITOR__LOG_LEVEL: ${{ secrets.PLANT_MONITOR__LOG_LEVEL }}
          PLANT_MONITOR__SERVICE_CALLBACK_TOKEN: ${{ secrets.PLANT_MONITOR__SERVICE_CALLBACK_TOKEN }}
          PLANT_MONITOR__SERVICE_HOST: ${{ secrets.PLANT_MONITOR__SERVICE_HOST }}
          PLANT_MONITOR__SERVICE_PORT: ${{ secrets.PLANT_MONITOR__SERVICE_PORT }}
          PLANT_MONITOR__STATE_PATH: ${{ secrets.PLANT_MONITOR__STATE_PATH }}
          PLANT_MONITOR__TZ: ${{ secrets.PLANT_MONITOR__TZ }}
          # END GENERATED SERVICE SECRETS
        run: |
          ./scripts/render-service-env --all \
            --base-dir "${{ github.workspace }}" \
            --deploy-base-dir /volume1/docker/homelab-config

      - name: Deploy changed services
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          ./scripts/homelab-deploy --changed \
            --base-dir "${{ github.workspace }}" \
            --deploy-base-dir /volume1/docker/homelab-config

      - name: Deploy requested service
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.service != 'all'
        run: |
          args=()
          if [ "${{ github.event.inputs.force_recreate }}" = "true" ]; then
            args+=(--force-recreate)
          fi
          ./scripts/homelab-deploy "${{ github.event.inputs.service }}" "${args[@]}" --deploy-base-dir /volume1/docker/homelab-config

      - name: Deploy all services
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.service == 'all'
        run: |
          args=()
          if [ "${{ github.event.inputs.force_recreate }}" = "true" ]; then
            args+=(--force-recreate)
          fi
          ./scripts/homelab-deploy --all "${args[@]}" --deploy-base-dir /volume1/docker/homelab-config
