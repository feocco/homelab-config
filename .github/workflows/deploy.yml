name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: Service to deploy, or "all"
        required: true
        default: plant-monitor

jobs:
  deploy:
    runs-on: [self-hosted, nasfeo]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync checkout to runtime path
        run: |
          tar \
            --exclude './.git' \
            --exclude './*/.env' \
            --exclude './*/data' \
            -cf - . | tar -C /volume1/docker/homelab-config -xf -

      - name: Render hello-nas environment
        env:
          HELLO_NAS_MESSAGE: ${{ secrets.HELLO_NAS__HELLO_NAS_MESSAGE }}
        run: |
          if [ -f "${{ github.workspace }}/hello-nas/.env.example" ]; then
            service_dir="/volume1/docker/homelab-config/hello-nas"
            mkdir -p "${service_dir}"
            {
              printf 'HELLO_NAS_MESSAGE=%s\n' "${HELLO_NAS_MESSAGE}"
              printf 'HOST_PORT=8099\n'
            } > "${service_dir}/.env"
            chmod 600 "${service_dir}/.env"
          fi

      - name: Deploy changed services
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          ./scripts/homelab-deploy --changed \
            --base-dir "${{ github.workspace }}" \
            --deploy-base-dir /volume1/docker/homelab-config

      - name: Deploy requested service
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.service != 'all'
        run: ./scripts/homelab-deploy "${{ github.event.inputs.service }}" --deploy-base-dir /volume1/docker/homelab-config

      - name: Deploy all services
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.service == 'all'
        run: ./scripts/homelab-deploy --all --deploy-base-dir /volume1/docker/homelab-config
