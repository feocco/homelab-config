name: Deploy Tooling

# Offline suite only. Live tailnet checks are deploy-tooling-live.yml.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate deploy tooling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.14"

      - name: Install validator dependency
        run: python -m pip install --require-hashes -r scripts/requirements-workflow-policy.txt

      - name: Run deploy tooling checks
        run: LC_ALL=C ./scripts/test-deploy-tooling --offline
