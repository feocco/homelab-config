name: Deploy Tooling

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate deploy tooling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.14"

      - name: Install validator dependency
        run: python -m pip install --require-hashes -r scripts/requirements-workflow-policy.txt

      - name: Install Tailscale CLI
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch=amd64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          tarball="$(python3 -c 'import json,sys,urllib.request; print(json.load(urllib.request.urlopen("https://pkgs.tailscale.com/stable/?mode=json"))["Tarballs"][sys.argv[1]])' "${arch}")"
          curl -fsSL "https://pkgs.tailscale.com/stable/${tarball}" -o "/tmp/${tarball}"
          tar -xzf "/tmp/${tarball}" -C /tmp
          sudo install -m 0755 "/tmp/${tarball%.tgz}/tailscale" /usr/local/bin/tailscale
          command -v tailscale
          tailscale version

      - name: Run deploy tooling checks
        run: LC_ALL=C ./scripts/test-deploy-tooling
