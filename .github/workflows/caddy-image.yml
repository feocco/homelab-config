name: Build Caddy Image

on:
  push:
    branches: [main]
    paths:
      - services/caddy/Dockerfile
      - services/caddy/.env.config
      - scripts/caddy-image-env
      - .github/workflows/caddy-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build Caddy with Cloudflare DNS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Load Caddy image metadata
        run: |
          ./scripts/caddy-image-env >> "${GITHUB_ENV}"

      - name: Build validation image
        run: |
          docker build \
            --build-arg CADDY_VERSION="${CADDY_VERSION}" \
            -t "${CADDY_IMAGE_REF}" \
            services/caddy

      - name: Verify Cloudflare DNS module
        run: |
          docker run --rm "${CADDY_IMAGE_REF}" caddy list-modules | grep -qx 'dns.providers.cloudflare'

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef  # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          docker push "${CADDY_IMAGE_REF}"
