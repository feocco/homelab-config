name: Docs

on:
  push:
    branches: [main]
    paths:
      - mkdocs.yml
      - docs/**
      - services/**/README.md
      - services/**/ops.yaml
      - hosts/**/services.yaml
      - scripts/generate-docs-service-index
      - scripts/build-docs-site
      - scripts/lib/homelab_catalog.py
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install docs dependencies
        run: python -m pip install -r docs/requirements.txt

      - name: Build docs
        run: scripts/build-docs-site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .site

  deploy:
    name: Deploy docs
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
