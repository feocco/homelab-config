name: Docs

on:
  push:
    branches: [main]
    paths:
      - mkdocs.yml
      - docs/**
      - services/**/README.md
      - services/**/ops.yaml
      - hosts/**/services.yaml
      - scripts/generate-docs-service-index
      - scripts/build-docs-site
      - scripts/lib/homelab_catalog.py
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.14"

      - name: Install docs dependencies
        run: python -m pip install -r docs/requirements.txt

      - name: Build docs
        run: scripts/build-docs-site
