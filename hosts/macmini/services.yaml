host:
  name: macmini
  deploy_base_dir: ${HOME}/homelab-config-runtime
  bind_addr: 192.168.1.43

services:
  hello-nas:
    path: services/hello-nas
    enabled: true

  plant-monitor:
    path: services/plant-monitor
    enabled: true

  dashy:
    path: services/dashy
    enabled: true

  caddy:
    path: services/caddy
    enabled: true

  homelab-functions:
    path: services/homelab-functions
    enabled: true

  hass-janitor:
    path: services/hass-janitor
    enabled: true

  homelab-log-watcher:
    path: services/homelab-log-watcher
    enabled: true

  homelab-sre-agent:
    path: services/homelab-sre-agent
    enabled: true

  homarr:
    path: services/homarr
    enabled: true

  homelab-monitor:
    path: services/homelab-monitor
    enabled: true

  bedtime:
    path: services/bedtime
    enabled: true

  mealie:
    path: services/mealie
    enabled: true

  mealie-planner:
    path: services/mealie-planner
    enabled: true

  instacart-history-service:
    path: services/instacart-history-service
    enabled: true
