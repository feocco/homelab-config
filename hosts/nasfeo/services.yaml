host:
  name: nasfeo
  deploy_base_dir: /volume1/docker/homelab-config
  bind_addr: 192.168.1.191

services:
  hello-nas:
    path: services/hello-nas
    enabled: false

  plant-monitor:
    path: services/plant-monitor
    enabled: false

  portainer:
    path: services/portainer
    enabled: true

  netalertx:
    path: services/netalertx
    enabled: false

  homelab-functions:
    path: services/homelab-functions
    enabled: false

  hass-janitor:
    path: services/hass-janitor
    enabled: false

  homelab-log-watcher:
    path: services/homelab-log-watcher
    enabled: true

  homelab-sre-agent:
    path: services/homelab-sre-agent
    enabled: false

  homelab-monitor:
    path: services/homelab-monitor
    enabled: false

  homelab-sentinel:
    path: services/homelab-sentinel
    enabled: true

  bedtime:
    path: services/bedtime
    enabled: false
