services:
  homarr:
    image: ghcr.io/homarr-labs/homarr:latest
    container_name: homarr
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-America/New_York}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY}
    ports:
      - "${HOMARR_HTTP_PORT:-7575}:7575"
    volumes:
      - ./data:/appdata
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "1"
        compress: "false"
